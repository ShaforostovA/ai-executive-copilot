include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

.backend_job:
  image: python:3.13-slim
  before_script:
    - python -m pip install --disable-pip-version-check -e './backend[dev]'

backend:lint:
  extends: .backend_job
  stage: validate
  script:
    - python -m compileall -q backend/src backend/tests
    - ruff check backend

backend:test:
  extends: .backend_job
  stage: test
  script:
    - pytest -q backend/tests --ignore=backend/tests/integration

backend:test:postgresql:
  stage: test
  image: python:3.13-slim
  services:
    - name: postgres:17-alpine
  variables:
    POSTGRES_USER: copilot_test
    POSTGRES_DB: copilot_test
    POSTGRES_PASSWORD: ci_postgres_only
    COPILOT_TEST_DATABASE_URL: postgresql+asyncpg://copilot_test:ci_postgres_only@postgres:5432/copilot_test
  before_script:
    - python -m pip install --disable-pip-version-check -e './backend[dev]'
    - |
      python - <<'PY'
      import socket
      import time

      for _ in range(60):
          try:
              with socket.create_connection(("postgres", 5432), timeout=1):
                  break
          except OSError:
              time.sleep(1)
      else:
          raise SystemExit("Disposable PostgreSQL service did not become ready.")
      PY
  script:
    - pytest -q backend/tests/integration/test_postgresql_auth.py

# Добавить frontend:lint и frontend:build после появления
# frontend/package-lock.json и рабочего Vite/React приложения.
# Deploy job, secrets и registry — отдельная задача после подготовки VPS.
