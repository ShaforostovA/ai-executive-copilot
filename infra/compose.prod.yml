x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: copilot-api:${APP_VERSION:-local}
  environment: &backend-environment
    COPILOT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    COPILOT_ENVIRONMENT: production
    COPILOT_USE_DEMO_REPOSITORY: "false"
    COPILOT_SESSION_COOKIE_SECURE: "true"
    COPILOT_ALLOWED_ORIGINS: https://${DOMAIN}
    COPILOT_TRUSTED_PROXY_IPS: 172.30.0.0/24
    COPILOT_GIGACHAT_ENABLED: ${GIGACHAT_ENABLED:-false}
    COPILOT_GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
    COPILOT_GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
    COPILOT_GIGACHAT_DAILY_REQUEST_LIMIT: ${AI_DAILY_LIMIT:-20}
    COPILOT_CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY}
    COPILOT_YANDEX_ALLOWED_FOLDERS: ${YANDEX_ALLOWED_FOLDERS:-INBOX}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g

  migrate:
    <<: *backend
    command: sh -c "cd /app/backend && alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  api:
    <<: *backend
    command: uvicorn copilot_api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: copilot-frontend:${APP_VERSION:-local}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 256m

volumes:
  pg_data:
  pg_backups:
  caddy_data:
  caddy_config:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
